name: Setup
description: Install pnpm and Node from .tool-versions, install dependencies, and sync SvelteKit types

runs:
  using: composite
  steps:
    - id: versions
      shell: bash
      run: echo "pnpm=$(grep '^pnpm ' .tool-versions | awk '{print $2}')" >> "$GITHUB_OUTPUT"

    # Installed before setup-node, which needs pnpm on the PATH to cache its store
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        version: ${{ steps.versions.outputs.pnpm }}
        run_install: false

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .tool-versions
        cache: pnpm

    - shell: bash
      run: pnpm install --frozen-lockfile

    - shell: bash
      run: pnpm sync
