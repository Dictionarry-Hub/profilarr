name: 🚀 Feature Request
description: Suggest a new feature or an improvement to an existing one
type: 🚀 Feature
labels: ['🔍 needs triage']

body:
  - type: markdown
    attributes:
      value: |
        Please read the [issue guidelines](https://github.com/Dictionarry-Hub/profilarr/issues/936) first.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Databases (linking, pulling, conflicts, local changes)
        - Entities (Quality Profiles, Custom Formats, Regular Expressions, Delay Profiles, Media Management)
        - Arr Instances
        - Sync
        - Drift
        - Library
        - Upgrades
        - Rename
        - Jobs & Scheduling
        - Notifications
        - Authentication & Security
        - Backups
        - Logs
        - Settings
        - Onboarding
        - Announcements / Inbox
        - Public API
        - Parser Service
        - Installation / Docker / Startup
        - Other / not listed
    validations:
      required: true

  - type: input
    id: area-details
    attributes:
      label: Area details
      description: Which page or feature. If you picked Other, describe the part of Profilarr this affects.

  - type: textarea
    id: request
    attributes:
      label: What do you want, and why?
      description: The problem you're trying to solve, and what you'd like Profilarr to do about it.
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: How do you handle this today?

  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: I searched existing issues and this hasn't been requested.
          required: true
        - label: I read the issue guidelines.
          required: true
        - label: I've verified this request, including any AI-written parts, marked guesses as guesses, and can answer follow-up questions.
          required: true
