name: 🐛 Bug Report
description: Something in Profilarr isn't working as expected
type: 🐛 Bug
labels: ['🔍 needs triage']

body:
  - type: markdown
    attributes:
      value: |
        Please read the [issue guidelines](https://github.com/Dictionarry-Hub/profilarr/issues/936) first.
        - Questions and setup help → [Discussions](https://github.com/Dictionarry-Hub/profilarr/discussions/new?category=q-a)
        - Wrong scores, regex, or profiles from a database → that database's repo
        - Security issues → [report privately](https://github.com/Dictionarry-Hub/profilarr/security/advisories/new)

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Databases (linking, pulling, conflicts, local changes)
        - Entities (Quality Profiles, Custom Formats, Regular Expressions, Delay Profiles, Media Management)
        - Arr Instances
        - Sync
        - Drift
        - Library
        - Upgrades
        - Rename
        - Jobs & Scheduling
        - Notifications
        - Authentication & Security
        - Backups
        - Logs
        - Settings
        - Onboarding
        - Announcements / Inbox
        - Public API
        - Parser Service
        - Installation / Docker / Startup
        - Other / not listed
    validations:
      required: true

  - type: input
    id: area-details
    attributes:
      label: Area details
      description: Required if you picked Entities or Other. Which page or feature, e.g. "Custom Formats → Conditions", or describe the part of Profilarr this affects.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Screenshots help. For grab or matching issues, include the Arr interactive search.
      placeholder: |
        1. Go to...
        2. Click...
        3. See...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Profilarr version
      description: Settings → About
      placeholder: e.g. 2.2.0
    validations:
      required: true

  - type: dropdown
    id: channel
    attributes:
      label: Release channel
      options:
        - Stable (latest)
        - Develop
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: Installation
      options:
        - Docker
        - From source
    validations:
      required: true

  - type: input
    id: arr
    attributes:
      label: Arr app and version
      description: If the issue involves an Arr instance.
      placeholder: e.g. Radarr 5.26.2

  - type: input
    id: database
    attributes:
      label: Linked database(s)
      placeholder: e.g. Dictionarry-Hub/database

  - type: textarea
    id: logs
    attributes:
      label: Profilarr logs
      description: Settings → Logs → Download. Attach the file or paste the relevant part.
    validations:
      required: true

  - type: textarea
    id: arr-logs
    attributes:
      label: Arr logs
      description: If an Arr instance is involved, logs from around the time of the issue.
      render: shell

  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: I searched existing issues and this hasn't been reported.
          required: true
        - label: I read the issue guidelines.
          required: true
        - label: I've verified this report, including any AI-written parts, marked guesses as guesses, and can answer follow-up questions.
          required: true
