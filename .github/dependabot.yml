version: 2
updates:
  - package-ecosystem: deno
    directory: /
    schedule:
      interval: monthly
      time: '14:00'
      timezone: 'Australia/Adelaide'
    # Minor and patch updates share one PR. Each major gets its own, so one
    # breaking upgrade can't hold back the rest.
    groups:
      deno:
        patterns:
          - '*'
        update-types: ['minor', 'patch']
    cooldown:
      default-days: 7
      semver-major-days: 30
    ignore:
      # The SvelteKit 3 upgrade needs code changes and is done by hand in #970.
      # Remove this once #970 merges.
      - dependency-name: '@sveltejs/kit'
        update-types: ['version-update:semver-major']
      # @db/sqlite is pinned to the npm-compat package at 0.12.0; 0.13.0's
      # npm.jsr.io tarball has a broken checksum, so any bump fails CI.
      # Remove once the upstream tarball is fixed (see deno#31749).
      - dependency-name: '@db/sqlite'
      - dependency-name: '@sveltejs/vite-plugin-svelte'
        update-types: ['version-update:semver-major']
      - dependency-name: 'kysely'
        update-types:
          - 'version-update:semver-minor'
          - 'version-update:semver-major'
      - dependency-name: '@types/node'
        update-types:
          - 'version-update:semver-major'
      # typescript must match the version bundled with the pinned Deno
      # (enforced by lint:toolchain). Bump it alongside Deno instead.
      - dependency-name: 'typescript'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '14:00'
      timezone: 'Australia/Adelaide'
    groups:
      github:
        patterns:
          - '*'
        update-types: ['minor', 'patch']
    cooldown:
      default-days: 7
