version: 2
updates:
  - package-ecosystem: deno
    directory: /
    schedule:
      interval: monthly
      time: '14:00'
      timezone: 'Australia/Adelaide'
    # Minor and patch updates share one PR. Each major gets its own, so one
    # breaking upgrade can't hold back the rest, except for packages that
    # require each other's majors, which move together. Dependabot uses the
    # first group that matches, so the major groups come before `deno`.
    groups:
      # @tailwindcss/vite pins tailwindcss to its exact version.
      tailwind-major:
        patterns:
          - 'tailwindcss'
          - '@tailwindcss/*'
          - 'prettier-plugin-tailwindcss'
        update-types: ['major']
      # SvelteKit needs matching vite and vite-plugin-svelte majors, and the
      # Vite plugins list each Vite major they support.
      svelte-vite-major:
        patterns:
          - 'svelte'
          - 'svelte-check'
          - '@sveltejs/*'
          - 'vite'
          - '@deno/vite-plugin'
          - 'esbuild'
          - '@lucide/svelte'
        update-types: ['major']
      # @playwright/test pins playwright to its exact version.
      playwright-major:
        patterns:
          - 'playwright'
          - '@playwright/test'
        update-types: ['major']
      # @eslint/js and the plugins list the ESLint majors they support.
      eslint-major:
        patterns:
          - 'eslint'
          - '@eslint/js'
          - 'typescript-eslint'
          - 'eslint-plugin-svelte'
          - 'svelte-eslint-parser'
        update-types: ['major']
      prettier-major:
        patterns:
          - 'prettier'
          - 'prettier-plugin-svelte'
        update-types: ['major']
      deno:
        patterns:
          - '*'
        update-types: ['minor', 'patch']
    cooldown:
      default-days: 7
      semver-major-days: 30
    ignore:
      - dependency-name: '@sveltejs/vite-plugin-svelte'
        update-types: ['version-update:semver-major']
      - dependency-name: 'kysely'
        update-types:
          - 'version-update:semver-minor'
          - 'version-update:semver-major'
      - dependency-name: '@types/node'
        update-types:
          - 'version-update:semver-major'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '14:00'
      timezone: 'Australia/Adelaide'
    groups:
      github:
        patterns:
          - '*'
        update-types: ['minor', 'patch']
    cooldown:
      default-days: 7

  # Every service image the flow suite runs (tests/flows/services.Dockerfile),
  # in one PR
  - package-ecosystem: docker
    directory: /tests/flows
    schedule:
      interval: monthly
      time: '14:00'
      timezone: 'Australia/Adelaide'
    groups:
      flow-services:
        patterns:
          - '*'
    cooldown:
      default-days: 7
