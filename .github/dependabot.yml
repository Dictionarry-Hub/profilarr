version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '14:00'
      timezone: 'Australia/Adelaide'
    open-pull-requests-limit: 10
    cooldown:
      default-days: 3
      semver-major-days: 7
    ignore:
      - dependency-name: '@sveltejs/vite-plugin-svelte'
        update-types: ['version-update:semver-major']
      - dependency-name: 'kysely'
        update-types:
          - 'version-update:semver-minor'
          - 'version-update:semver-major'

  - package-ecosystem: deno
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '14:00'
      timezone: 'Australia/Adelaide'
    open-pull-requests-limit: 10
    cooldown:
      default-days: 3
      semver-major-days: 7

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '14:00'
      timezone: 'Australia/Adelaide'
    open-pull-requests-limit: 10
    cooldown:
      default-days: 3
