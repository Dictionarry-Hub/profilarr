name: Claude Review

# Runs only for the maintainer: on PRs they open, and when they comment `@claude review`.
# Four reviews run in parallel; each returns a JSON form that render.ts turns into one comment.
# Review config (prompts, schemas, renderer) comes from the PR branch for the maintainer's own
# PRs, and from develop for comment triggers, which can run on contributor PRs.

on:
  pull_request:
    branches: [develop]
    types: [opened, ready_for_review]
  issue_comment:
    types: [created]

permissions: {}

jobs:
  setup:
    name: Resolve PR
    if: >-
      (github.event_name == 'pull_request' &&
      github.event.pull_request.user.login == 'santiagosayshey' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft) ||
      (github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      github.event.comment.user.login == 'santiagosayshey' &&
      startsWith(github.event.comment.body, '@claude review'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      pr: ${{ steps.pr.outputs.pr }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      config_ref: ${{ steps.pr.outputs.config_ref }}
      website_ref: ${{ steps.pr.outputs.website_ref }}
      website_label: ${{ steps.pr.outputs.website_label }}
    steps:
      - name: Resolve PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          gh api "repos/$REPO/pulls/$PR" > "$RUNNER_TEMP/pr.json"
          head_sha=$(jq -r '.head.sha' "$RUNNER_TEMP/pr.json")

          # A linked profilarr.com PR is reviewed instead of its develop branch.
          website_pr=$(jq -r '.body // ""' "$RUNNER_TEMP/pr.json" \
            | grep -oE 'github\.com/Dictionarry-Hub/profilarr\.com/pull/[0-9]+' \
            | head -n 1 | grep -oE '[0-9]+$' || true)
          if [ -n "$website_pr" ]; then
            website_ref="refs/pull/$website_pr/head"
            website_label="profilarr.com PR #$website_pr"
          else
            website_ref="develop"
            website_label="profilarr.com develop"
          fi

          if [ "$EVENT" = "pull_request" ]; then
            config_ref="$head_sha"
          else
            config_ref=$(jq -r '.base.repo.default_branch' "$RUNNER_TEMP/pr.json")
          fi

          {
            echo "pr=$PR"
            echo "head_sha=$head_sha"
            echo "config_ref=$config_ref"
            echo "website_ref=$website_ref"
            echo "website_label=$website_label"
          } >> "$GITHUB_OUTPUT"

  review:
    name: Review (${{ matrix.review }})
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    concurrency:
      group: claude-review-${{ needs.setup.outputs.pr }}-${{ matrix.review }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - review: user-docs
            model: claude-sonnet-5-5
            website: true
          - review: technical-docs
            model: claude-sonnet-5-5
          - review: tests
            model: claude-sonnet-5-5
          - review: code
            model: claude-opus-5-5
    steps:
      # develop at the workspace root; the PR and other inputs go in subdirectories.
      - name: Check out develop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Check out PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ needs.setup.outputs.pr }}/head
          path: pr-head
          persist-credentials: false

      - name: Check out review config
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.setup.outputs.config_ref }}
          path: review-config
          sparse-checkout: .github/claude-review
          persist-credentials: false

      - name: Check out website
        if: matrix.website
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Dictionarry-Hub/profilarr.com
          ref: ${{ needs.setup.outputs.website_ref }}
          path: website
          persist-credentials: false

      - name: Build prompt
        id: prompt
        env:
          CONFIG: review-config/.github/claude-review
          REVIEW: ${{ matrix.review }}
          PR: ${{ needs.setup.outputs.pr }}
          WEBSITE_LABEL: ${{ needs.setup.outputs.website_label }}
        run: |
          prompt=$(cat "$CONFIG/shared.md"; echo; cat "$CONFIG/$REVIEW.md")
          prompt=${prompt//\{PR\}/$PR}
          prompt=${prompt//\{WEBSITE_REF\}/$WEBSITE_LABEL}
          {
            echo "prompt<<PROMPT_EOF"
            echo "$prompt"
            echo "PROMPT_EOF"
            echo "schema=$(jq -c . "$CONFIG/schemas/$REVIEW.json")"
          } >> "$GITHUB_OUTPUT"

      - name: Run Claude
        id: claude
        uses: anthropics/claude-code-action@6fed3ca145920b639991cb756090506e1bcaf515 # v1.0.245
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: ${{ steps.prompt.outputs.prompt }}
          claude_args: >-
            --model ${{ matrix.model }}
            --max-turns 40
            --allowedTools "Read,Grep,Glob,Bash(gh pr view:*),Bash(gh pr diff:*)"
            --json-schema '${{ steps.prompt.outputs.schema }}'

      - name: Save result
        if: always()
        env:
          RESULT: ${{ steps.claude.outputs.structured_output }}
          WEBSITE_LABEL: ${{ needs.setup.outputs.website_label }}
        run: |
          mkdir -p "$RUNNER_TEMP/review"
          printf '%s' "$RESULT" > "$RUNNER_TEMP/review/result.json"
          website_sha=""
          if [ -d website/.git ]; then website_sha=$(git -C website rev-parse HEAD); fi
          jq -n --arg sha "$website_sha" --arg label "$WEBSITE_LABEL" \
            '{website_sha: $sha, website_label: $label}' > "$RUNNER_TEMP/review/meta.json"

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: claude-review-${{ matrix.review }}
          path: ${{ runner.temp }}/review/
          retention-days: 7

  comment:
    name: Post reviews
    needs: [setup, review]
    if: ${{ !cancelled() && needs.setup.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: claude-review-comment-${{ needs.setup.outputs.pr }}
    steps:
      - name: Check out review config
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.setup.outputs.config_ref }}
          sparse-checkout: |
            .github/claude-review
            .tool-versions
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version-file: .tool-versions

      - name: Download results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: claude-review-*
          path: ${{ runner.temp }}/reviews

      - name: Post or update comments
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ needs.setup.outputs.pr }}
          HEAD_SHA: ${{ needs.setup.outputs.head_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          for review in user-docs technical-docs tests code; do
            deno run --no-config \
              --allow-read="$RUNNER_TEMP/reviews" --allow-env=REPO,HEAD_SHA,RUN_URL \
              .github/claude-review/render.ts "$review" "$RUNNER_TEMP/reviews/claude-review-$review" \
              > "$RUNNER_TEMP/body.md"

            marker="<!-- claude-review:$review -->"
            existing=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
              --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" \
              | head -n 1)
            if [ -n "$existing" ]; then
              gh api --method PATCH "repos/$REPO/issues/comments/$existing" -F "body=@$RUNNER_TEMP/body.md" > /dev/null
            else
              gh api "repos/$REPO/issues/$PR/comments" -F "body=@$RUNNER_TEMP/body.md" > /dev/null
            fi
          done
