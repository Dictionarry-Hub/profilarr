name: Build Release Docker Image

on:
    push:
        tags:
            - 'v*'

jobs:
    build:
        runs-on: ubuntu-latest
        strategy:
          fail-fast: false
          matrix:
            include:
              - dockerfile: Dockerfile
                suffix:
                use_latest: true
              - dockerfile: Dockerfile.alpine
                suffix: -alpine
                use_latest: false
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v3
              with:
                platforms: linux/amd64,linux/arm64/v8

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '18'

            - name: Build frontend
              working-directory: ./frontend
              run: |
                  npm ci
                  npm run build

            - name: Prepare dist directory
              run: |
                  mkdir -p dist/backend dist/static
                  cp -r frontend/dist/* dist/static/
                  cp -r backend/* dist/backend/
                  cp backend/requirements.txt dist/

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Extract metadata (tags, labels) for Docker
              id: meta
              uses: docker/metadata-action@v5.10.0
              with:
                images: santiagosayshey/profillar
                flavor: |
                  latest=${{ matrix.use_latest }}
                  suffix=${{ matrix.suffix }}
                tags: |
                  type=ref,event=tag
                  type=raw,value=alpine,suffix=,enable=${{ matrix.suffix == '-alpine' }}

            - name: Build and push
              uses: docker/build-push-action@v5
              with:
                  context: .
                  platforms: linux/amd64,linux/arm64/v8
                  file: ${{ matrix.dockerfile }}
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: |
                      ${{ steps.meta.outputs.labels }}
                      org.opencontainers.image.authors="Dictionarry dictionarry@pm.me"
                      org.opencontainers.image.description="Profilarr - Profile manager for *arr apps"
                      org.opencontainers.image.source="https://github.com/Dictionarry-Hub/profilarr"
                      org.opencontainers.image.title="Profilarr"
