name: CI

on:
  push:
    branches: ['hotfix/*']
    paths-ignore:
      ['docs/**', '*.md', '!SECURITY.md', '.github/issue_template/**', '.github/assets/**']
  pull_request:
    branches: [develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  ci-scope:
    name: Detect CI Scope
    runs-on: ubuntu-latest
    outputs:
      full_ci: ${{ steps.push.outputs.full_ci || steps.filter.outputs.full_ci }}
    steps:
      - id: push
        if: github.event_name != 'pull_request'
        run: echo "full_ci=true" >> "$GITHUB_OUTPUT"

      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: every
          filters: |
            full_ci:
              - '**'
              - '!docs/**'
              - '!*.md'
              - '!LICENSE'
              - '!.github/issue_template/**'
              - '!.github/assets/**'

  docs-only:
    name: Docs-only CI
    needs: [ci-scope]
    if: ${{ needs.ci-scope.outputs.full_ci != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Report skipped CI
        run: |
          echo "Docs-only change detected." >> "$GITHUB_STEP_SUMMARY"
          echo "Build, lint, type-check, tests, Semgrep, integration, and E2E jobs were intentionally skipped." >> "$GITHUB_STEP_SUMMARY"

  # ─── Build ──────────────────────────────────────────────────────────────

  build:
    name: Build
    needs: [ci-scope]
    if: ${{ needs.ci-scope.outputs.full_ci == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - name: Build
        run: pnpm build

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: profilarr-build
          path: dist/build
          retention-days: 1

  # ─── Quality gates (all run in parallel with build) ─────────────────────

  lint:
    name: Lint
    needs: [ci-scope]
    if: ${{ needs.ci-scope.outputs.full_ci == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - name: Lint
        run: pnpm lint

  type-check:
    name: Type Check
    needs: [ci-scope]
    if: ${{ needs.ci-scope.outputs.full_ci == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - name: Type check
        run: pnpm check

  unit:
    name: Unit Tests
    needs: [ci-scope]
    if: ${{ needs.ci-scope.outputs.full_ci == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - name: Run unit tests
        run: pnpm test:unit

  semgrep:
    name: Semgrep
    needs: [ci-scope]
    if: ${{ needs.ci-scope.outputs.full_ci == 'true' }}
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config tests/scan/semgrep/ \
            --config p/default \
            --config p/typescript \
            --config p/javascript \
            --config p/owasp-top-ten \
            --config p/nodejs \
            --config p/security-audit \
            --config p/csharp \
            --error

  # ─── Container scanning ────────────────────────────────────────────────

  trivy:
    name: Trivy
    needs: [ci-scope]
    if: ${{ needs.ci-scope.outputs.full_ci == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build images
        run: docker compose -f compose.yml -f compose.dev.yml build

      # OS packages from Alpine and the Bun base image block the merge
      - name: Scan profilarr OS packages
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'profilarr:alpine'
          vuln-type: 'os'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      # npm packages are bundled into the server, so Trivy reads them from the
      # image's SBOM. Dependabot alerts track them from the lockfile, so this
      # scan only reports.
      - name: Scan profilarr npm packages
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'profilarr:alpine'
          vuln-type: 'library'
          list-all-pkgs: 'true'
          format: 'json'
          output: 'trivy-npm.json'

      # Trivy skips an SBOM it can't read without a warning, which would leave
      # the npm scan empty, so an empty package list fails the job.
      - name: Report npm findings
        run: |
          packages=$(jq '[.Results[]? | select(.Type == "node-pkg") | .Packages[]?] | length' trivy-npm.json)
          if [ "$packages" -eq 0 ]; then
            echo "::error::Trivy found no npm packages in profilarr:alpine. Check that the image still ships a CycloneDX SBOM Trivy can read."
            exit 1
          fi
          findings=$(jq -r '.Results[]? | select(.Type == "node-pkg") | .Vulnerabilities[]? | "| \(.PkgName) | \(.InstalledVersion) | \(.VulnerabilityID) | \(.Severity) | \(.FixedVersion // "none") |"' trivy-npm.json)
          serious=$(jq '[.Results[]? | select(.Type == "node-pkg") | .Vulnerabilities[]? | select(.Severity == "HIGH" or .Severity == "CRITICAL")] | length' trivy-npm.json)
          if [ "$serious" -gt 0 ]; then
            echo "::warning::$serious high or critical npm findings in profilarr:alpine. See the Trivy job summary."
          fi
          {
            echo "### npm packages in profilarr:alpine"
            echo
            echo "Trivy read $packages npm packages from the image SBOM. These findings don't fail CI."
            echo
            if [ -n "$findings" ]; then
              echo "| Package | Version | Vulnerability | Severity | Fixed in |"
              echo "| --- | --- | --- | --- | --- |"
              echo "$findings"
            else
              echo "No known vulnerabilities."
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Scan parser
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'profilarr-parser:alpine'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

  # ─── Tests that run the build on Bun ────────────────────────────────────

  integration:
    name: Integration Tests
    needs: [ci-scope, build]
    if: ${{ needs.ci-scope.outputs.full_ci == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions

      - name: Download build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: profilarr-build
          path: dist/build

      - name: Cache Docker images
        id: docker-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/docker-images.tar
          key: docker-images-${{ hashFiles('tests/integration/specs/auth/docker-compose.yml') }}

      - name: Load cached Docker images
        if: steps.docker-cache.outputs.cache-hit == 'true'
        run: docker load -i /tmp/docker-images.tar

      - name: Pull and save Docker images
        if: steps.docker-cache.outputs.cache-hit != 'true'
        run: |
          docker pull ghcr.io/navikt/mock-oauth2-server:3.0.1
          docker pull caddy:2-alpine
          docker pull nginx:alpine
          docker save ghcr.io/navikt/mock-oauth2-server:3.0.1 caddy:2-alpine nginx:alpine -o /tmp/docker-images.tar

      - name: Run integration tests
        run: pnpm test:integration

  # The suite is split across four runners. Each runs every fourth spec file
  # (`--deal`), so a slow area's files spread across them.
  flows:
    name: Flow Tests (${{ matrix.shard }}/4)
    needs: [ci-scope, build]
    if: ${{ needs.ci-scope.outputs.full_ci == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions

      - name: Download build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: profilarr-build
          path: dist/build

      # The images real-service tests run, pinned in tests/flows/services.Dockerfile.
      # scripts/flows/run.ts only pulls images missing from the host.
      - name: Cache flow service images
        id: flow-images
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/flow-images.tar
          key: flow-images-${{ hashFiles('tests/flows/services.Dockerfile') }}

      - name: Load cached flow service images
        if: steps.flow-images.outputs.cache-hit == 'true'
        run: docker load -i /tmp/flow-images.tar

      - name: Pull and save flow service images
        if: steps.flow-images.outputs.cache-hit != 'true'
        run: |
          images=$(awk 'toupper($1) == "FROM" { print $2 }' tests/flows/services.Dockerfile)
          for image in $images; do docker pull --quiet "$image"; done
          # shellcheck disable=SC2086
          docker save $images -o /tmp/flow-images.tar

      # Runs in the Playwright image matching the installed @playwright/test,
      # with 4 workers on CI (tests/flows/playwright.config.ts). `--online`
      # gives the container network, so the tests tagged @online, which link a
      # real database from GitHub, run here too.
      - name: Run flow tests
        run: pnpm test:flows --online --deal=${{ matrix.shard }}/4

      # The blob report holds every result and its traces. Flow Tests merges them.
      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flow-blob-${{ matrix.shard }}
          path: tests/flows/blob-report/
          retention-days: 1

  # The develop ruleset requires this check, not the shards. It merges the
  # shards' reports into one and fails if any shard failed. Docs-only changes
  # skip the shards and pass here.
  flows-report:
    name: Flow Tests
    needs: [ci-scope, flows]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    env:
      SHARDS_RAN: ${{ needs.flows.result == 'success' || needs.flows.result == 'failure' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ env.SHARDS_RAN == 'true' }}

      - uses: ./.github/actions/setup
        if: ${{ env.SHARDS_RAN == 'true' }}

      - name: Download blob reports
        if: ${{ env.SHARDS_RAN == 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: flow-blob-*
          merge-multiple: true
          path: flow-blobs

      # Prints the whole suite's results in one place, as a single run would
      - name: Merge reports
        if: ${{ env.SHARDS_RAN == 'true' }}
        run: node node_modules/playwright/cli.js merge-reports --reporter=./tests/flows/reporter.ts,html flow-blobs

      - name: Upload flow report
        if: ${{ !cancelled() && needs.flows.result == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flow-report
          path: playwright-report/
          retention-days: 7

      - name: Check every shard passed
        if: ${{ !cancelled() && needs.ci-scope.outputs.full_ci == 'true' && needs.flows.result != 'success' }}
        run: |
          echo "A flow test shard ended with: ${{ needs.flows.result }}"
          exit 1
