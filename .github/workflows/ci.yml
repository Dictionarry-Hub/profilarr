name: CI

on:
  push:
    branches: ['hotfix/*']
    paths-ignore:
      ['docs/**', '*.md', '!SECURITY.md', '.github/issue_template/**', '.github/assets/**']
  pull_request:
    branches: [develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  ci-scope:
    name: Detect CI Scope
    runs-on: ubuntu-latest
    outputs:
      full_ci: ${{ steps.push.outputs.full_ci || steps.filter.outputs.full_ci }}
    steps:
      - id: push
        if: github.event_name != 'pull_request'
        run: echo "full_ci=true" >> "$GITHUB_OUTPUT"

      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: every
          filters: |
            full_ci:
              - '**'
              - '!docs/**'
              - '!*.md'
              - '!LICENSE'
              - '!.github/issue_template/**'
              - '!.github/assets/**'

  docs-only:
    name: Docs-only CI
    needs: [ci-scope]
    if: ${{ needs.ci-scope.outputs.full_ci != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Report skipped CI
        run: |
          echo "Docs-only change detected." >> "$GITHUB_STEP_SUMMARY"
          echo "Build, lint, type-check, tests, Semgrep, integration, and E2E jobs were intentionally skipped." >> "$GITHUB_STEP_SUMMARY"

  # ─── Build ──────────────────────────────────────────────────────────────

  build:
    name: Build
    needs: [ci-scope]
    if: ${{ needs.ci-scope.outputs.full_ci == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version-file: .tool-versions

      - name: Cache deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/deno
            node_modules
          key: deno-${{ runner.os }}-${{ hashFiles('deno.lock') }}
          restore-keys: deno-${{ runner.os }}-

      - run: deno ci

      - name: Build
        run: deno task build

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: profilarr-build
          path: |
            dist/build/profilarr
            dist/build/server.js
            dist/build/static/
          retention-days: 1

  # ─── Quality gates (all run in parallel with build) ─────────────────────

  lint:
    name: Lint
    needs: [ci-scope]
    if: ${{ needs.ci-scope.outputs.full_ci == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version-file: .tool-versions

      - name: Cache deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/deno
            node_modules
          key: deno-${{ runner.os }}-${{ hashFiles('deno.lock') }}
          restore-keys: deno-${{ runner.os }}-

      - run: deno ci

      - name: Lint
        run: deno task lint

  type-check:
    name: Type Check
    needs: [ci-scope]
    if: ${{ needs.ci-scope.outputs.full_ci == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version-file: .tool-versions

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions

      - name: Cache deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/deno
            node_modules
          key: deno-${{ runner.os }}-${{ hashFiles('deno.lock') }}
          restore-keys: deno-${{ runner.os }}-

      - run: deno ci

      - name: Sync SvelteKit types
        run: deno run -A npm:@sveltejs/kit sync

      - name: Type check
        run: deno task check

  unit:
    name: Unit Tests
    needs: [ci-scope]
    if: ${{ needs.ci-scope.outputs.full_ci == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version-file: .tool-versions

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions

      - name: Cache deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/deno
            node_modules
          key: deno-${{ runner.os }}-${{ hashFiles('deno.lock') }}
          restore-keys: deno-${{ runner.os }}-

      - run: deno ci

      - name: Run unit tests
        run: deno task test

  semgrep:
    name: Semgrep
    needs: [ci-scope]
    if: ${{ needs.ci-scope.outputs.full_ci == 'true' }}
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config tests/scan/semgrep/ \
            --config p/default \
            --config p/typescript \
            --config p/javascript \
            --config p/owasp-top-ten \
            --config p/nodejs \
            --config p/security-audit \
            --config p/csharp \
            --error

  # ─── Container scanning ────────────────────────────────────────────────

  trivy:
    name: Trivy
    needs: [ci-scope]
    if: ${{ needs.ci-scope.outputs.full_ci == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build images
        run: docker compose -f compose.yml -f compose.dev.yml build

      - name: Scan profilarr
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'profilarr:alpine'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Scan parser
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'profilarr-parser:alpine'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

  # ─── Tests that need the binary ─────────────────────────────────────────

  integration:
    name: Integration Tests
    needs: [ci-scope, build]
    if: ${{ needs.ci-scope.outputs.full_ci == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version-file: .tool-versions

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions

      - name: Cache deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/deno
            node_modules
          key: deno-${{ runner.os }}-${{ hashFiles('deno.lock') }}
          restore-keys: deno-${{ runner.os }}-

      - run: deno ci

      - name: Download build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: profilarr-build
          path: dist/build

      - name: Make binary executable
        run: chmod +x dist/build/profilarr

      - name: Cache Docker images
        id: docker-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/docker-images.tar
          key: docker-images-${{ hashFiles('tests/integration/auth/docker-compose.yml') }}

      - name: Load cached Docker images
        if: steps.docker-cache.outputs.cache-hit == 'true'
        run: docker load -i /tmp/docker-images.tar

      - name: Pull and save Docker images
        if: steps.docker-cache.outputs.cache-hit != 'true'
        run: |
          docker pull ghcr.io/navikt/mock-oauth2-server:3.0.1
          docker pull caddy:2-alpine
          docker pull nginx:alpine
          docker save ghcr.io/navikt/mock-oauth2-server:3.0.1 caddy:2-alpine nginx:alpine -o /tmp/docker-images.tar

      - name: Run integration tests
        run: deno task test integration

  # The suite is split across four runners. Each runs every fourth spec file
  # (`--deal`), so a slow area's files spread across them.
  flows:
    name: Flow Tests (${{ matrix.shard }}/4)
    needs: [ci-scope, build]
    if: ${{ needs.ci-scope.outputs.full_ci == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version-file: .tool-versions

      - name: Cache deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/deno
            node_modules
          key: deno-${{ runner.os }}-${{ hashFiles('deno.lock') }}
          restore-keys: deno-${{ runner.os }}-

      - run: deno ci

      # Playwright strips types without checking them, and `deno task check`
      # covers src/ only, so the flow suite is type-checked here, on one shard.
      - name: Type check the flow suite
        if: ${{ matrix.shard == 1 }}
        run: deno check --quiet tests/flows

      - name: Download build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: profilarr-build
          path: dist/build

      - name: Make binary executable
        run: chmod +x dist/build/profilarr

      # The images real-service tests run, pinned in tests/flows/services.Dockerfile.
      # scripts/flows.ts only pulls images missing from the host.
      - name: Cache flow service images
        id: flow-images
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/flow-images.tar
          key: flow-images-${{ hashFiles('tests/flows/services.Dockerfile') }}

      - name: Load cached flow service images
        if: steps.flow-images.outputs.cache-hit == 'true'
        run: docker load -i /tmp/flow-images.tar

      - name: Pull and save flow service images
        if: steps.flow-images.outputs.cache-hit != 'true'
        run: |
          images=$(awk 'toupper($1) == "FROM" { print $2 }' tests/flows/services.Dockerfile)
          for image in $images; do docker pull --quiet "$image"; done
          # shellcheck disable=SC2086
          docker save $images -o /tmp/flow-images.tar

      # Runs in the Playwright image matching the installed @playwright/test,
      # with 4 workers on CI (tests/flows/playwright.config.ts). `--online`
      # gives the container network, so the tests tagged @online, which link a
      # real database from GitHub, run here too.
      - name: Run flow tests
        run: deno task flows --online --deal=${{ matrix.shard }}/4

      # The blob report holds every result and its traces. Flow Tests merges them.
      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flow-blob-${{ matrix.shard }}
          path: tests/flows/blob-report/
          retention-days: 1

  # The develop ruleset requires this check, not the shards. It merges the
  # shards' reports into one and fails if any shard failed. Docs-only changes
  # skip the shards and pass here.
  flows-report:
    name: Flow Tests
    needs: [ci-scope, flows]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    env:
      SHARDS_RAN: ${{ needs.flows.result == 'success' || needs.flows.result == 'failure' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ env.SHARDS_RAN == 'true' }}

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        if: ${{ env.SHARDS_RAN == 'true' }}
        with:
          deno-version-file: .tool-versions

      - name: Cache deps
        if: ${{ env.SHARDS_RAN == 'true' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/deno
            node_modules
          key: deno-${{ runner.os }}-${{ hashFiles('deno.lock') }}
          restore-keys: deno-${{ runner.os }}-

      - if: ${{ env.SHARDS_RAN == 'true' }}
        run: deno ci

      - name: Download blob reports
        if: ${{ env.SHARDS_RAN == 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: flow-blob-*
          merge-multiple: true
          path: flow-blobs

      # Prints the whole suite's results in one place, as a single run would
      - name: Merge reports
        if: ${{ env.SHARDS_RAN == 'true' }}
        run: node node_modules/playwright/cli.js merge-reports --reporter=./tests/flows/reporter.ts,html flow-blobs

      - name: Upload flow report
        if: ${{ !cancelled() && needs.flows.result == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flow-report
          path: playwright-report/
          retention-days: 7

      - name: Check every shard passed
        if: ${{ !cancelled() && needs.ci-scope.outputs.full_ci == 'true' && needs.flows.result != 'success' }}
        run: |
          echo "A flow test shard ended with: ${{ needs.flows.result }}"
          exit 1
