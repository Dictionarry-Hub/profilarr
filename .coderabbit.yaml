# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-AU
tone_instructions: >-
  Be concise and specific. Report actionable defects with file and line evidence
  and practical impact. Avoid restating the diff, speculative concerns, and style
  advice already enforced by CI.

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: false
  high_level_summary_in_walkthrough: true
  changed_files_summary: false
  sequence_diagrams: false
  estimate_code_review_effort: false
  related_issues: false
  related_prs: false
  suggested_labels: false
  suggested_reviewers: false
  poem: false
  review_details: true
  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false
  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
  path_instructions:
    - path: '**/*'
      instructions: >-
        Follow the committed project docs. Use docs/ARCHITECTURE.md as the index
        to read relevant subsystem documentation before judging a change.
        Review behavior, correctness, security, and regressions. Assess testing
        against the existing Deno suites and CI workflows; contributors aren't
        required to write tests. Don't propose unrelated frameworks or one-off
        validation scripts. Keep PR descriptions contributor-authored and concise.
    - path: 'src/routes/api/v1/**'
      instructions: >-
        Follow docs/backend/api.md. Public API changes are contract-first:
        update OpenAPI YAML and regenerate committed API artifacts. Check that
        documented permissions and response behavior match the implementation.
    - path: 'src/lib/server/db/**'
      instructions: >-
        Follow docs/backend/database.md. Database changes need new migrations;
        don't edit applied migrations. Assess compatibility with existing data.
    - path: '**/*.svelte'
      instructions: >-
        Follow docs/frontend/ui.md and the relevant alerts, dirty tracking, and
        clipboard docs linked from docs/ARCHITECTURE.md. Use existing shared UI
        components and assess interaction changes separately from visual changes.
  pre_merge_checks:
    # GitHub Actions owns title and template structure; avoid duplicate checks.
    title:
      mode: 'off'
    description:
      mode: 'off'
    docstrings:
      mode: 'off'
    custom_checks:
      - name: Documentation impact
        mode: warning
        instructions: |-
          Assess the User-facing docs and Technical docs responses against the
          actual change. Prioritize user-facing documentation in the linked
          Dictionarry-Hub/profilarr.com repository. Inspect relevant source pages
          and any referenced companion docs PR using the selected linked ref.
          Compare documented steps, settings, defaults, API behavior, and upgrade
          instructions with the implementation. Technical repo docs do not
          substitute for user docs when users need different instructions.
          Pass when affected docs are accurate at the reviewed refs, or the
          explanations for no update are supported by the change. A docs PR may
          be pending publication with the app release; don't require premature
          publication. Don't require unrelated docs edits or new pages when
          existing docs are sufficient.
          Fail only for a concrete missing or inaccurate passage or user workflow;
          cite the documentation path and implementation evidence and identify
          the needed correction. Return Inconclusive when necessary documentation
          or a referenced companion change cannot be inspected. Never infer
          accuracy merely from a link or a changed documentation file.
      - name: Testing evidence
        mode: warning
        instructions: |-
          Assess the Testing response against changed behavior, existing test
          cases, and the committed CI workflows. Distinguish CI actually passing
          from tests being present or expected to run. Never claim to have run
          tests yourself. Don't require new tests from contributors; maintainer
          follow-up identifying a relevant coverage gap is acceptable.
          Pass when the stated existing or updated CI coverage fits the change,
          or a justified automated-tests-not-applicable response describes
          relevant manual verification and available evidence. Documentation-only
          and purely visual changes may use this alternative; interaction or
          behavior changes still need a coverage assessment. Inspect screenshots
          or rendered docs when available, and don't claim to have viewed evidence
          you cannot access. An honest statement that verification hasn't happened
          is acceptable disclosure, not proof of correctness.
          Fail for concrete false verification claims or a material coverage gap
          that the response overlooks; cite relevant code, test, or workflow paths.
          Return Inconclusive when necessary evidence cannot be inspected.
          Don't request one-off scripts, unrelated tool commands, new frameworks,
          or tests that merely repeat the implementation.
  tools:
    # Deno lint and Prettier in CI define our style rules.
    eslint:
      enabled: false
    markdownlint:
      enabled: false

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - files: 'docs/CONTRIBUTING.md,docs/ARCHITECTURE.md,docs/DEVELOPMENT.md'
        applyTo: '**/*'
  linked_repositories:
    - repository: Dictionarry-Hub/profilarr.com
      instructions: >-
        Contains Profilarr's user-facing documentation. Inspect relevant pages
        when app behavior, configuration, setup, authentication, sync, or upgrade
        requirements change. Use referenced companion PRs or branches to assess
        coordinated changes. Cite specific paths and inaccurate passages; if
        access or the selected ref is unavailable, report that limitation.

chat:
  art: false
