databases:
  get:
    operationId: listDatabases
    summary: List Databases
    description: |
      Secrets are stripped: `personal_access_token` is replaced by `hasPat` (boolean)
      and `local_path` is excluded.
    tags:
      - Databases
    responses:
      '200':
        description: List of linked databases
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../schemas/databases.yaml#/DatabaseInstance'
      '401':
        description: Not authenticated
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorResponse'
  post:
    operationId: createDatabase
    summary: Link Database
    description: |
      Clones the repository, validates its PCD manifest, and processes dependencies.
      This is synchronous and may take several seconds for large repositories.

      Field dependencies:
      - `personal_access_token` requires `git_user_name` and `git_user_email`
      - `local_ops_enabled` requires `personal_access_token`
      - `conflict_strategy` is only accepted without a PAT, or with PAT + `local_ops_enabled`
    tags:
      - Databases
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/databases.yaml#/CreateDatabaseInput'
    responses:
      '201':
        description: Database linked
        content:
          application/json:
            schema:
              $ref: '../schemas/databases.yaml#/DatabaseInstance'
      '400':
        description: Validation error
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorResponse'
            example:
              error: Name and repository URL are required
      '401':
        description: Not authenticated
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorResponse'
            example:
              error: Unauthorized
      '409':
        description: A database with this name already exists
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorResponse'
            example:
              error: A database with this name already exists
      '422':
        description: Link failed (invalid URL, clone failure, bad manifest)
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorResponse'
            example:
              error: 'Repository not found or inaccessible'

database:
  parameters:
    - name: id
      in: path
      required: true
      description: Database instance ID
      schema:
        type: integer
  get:
    operationId: getDatabase
    summary: Get Database
    description: |
      Secrets are stripped: `personal_access_token` is replaced by `hasPat` (boolean)
      and `local_path` is excluded.
    tags:
      - Databases
    responses:
      '200':
        description: Database detail
        content:
          application/json:
            schema:
              $ref: '../schemas/databases.yaml#/DatabaseInstance'
      '401':
        description: Not authenticated
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorResponse'
            example:
              error: Unauthorized
      '404':
        description: Database not found
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorResponse'
            example:
              error: Database not found
  patch:
    operationId: updateDatabase
    summary: Update Database
    description: |
      Partial update. Only the provided fields are changed. Unknown fields
      are silently ignored.

      Field dependencies:
      - `personal_access_token` requires `git_user_name` and `git_user_email`
      - `local_ops_enabled` requires `personal_access_token`
      - `conflict_strategy` is only accepted without a PAT, or with PAT + `local_ops_enabled`
    tags:
      - Databases
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/databases.yaml#/UpdateDatabaseInput'
    responses:
      '200':
        description: Database updated
        content:
          application/json:
            schema:
              $ref: '../schemas/databases.yaml#/DatabaseInstance'
      '400':
        description: Validation error or empty body
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorResponse'
            example:
              error: No updatable fields provided
      '401':
        description: Not authenticated
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorResponse'
            example:
              error: Unauthorized
      '404':
        description: Database not found
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorResponse'
            example:
              error: Database not found
      '409':
        description: A database with this name already exists
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorResponse'
            example:
              error: A database with this name already exists
  delete:
    operationId: deleteDatabase
    summary: Unlink Database
    description: |
      Removes the database row, deletes the cloned repository from disk,
      and cancels any scheduled sync jobs.
    tags:
      - Databases
    responses:
      '204':
        description: Database unlinked
      '401':
        description: Not authenticated
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorResponse'
            example:
              error: Unauthorized
      '404':
        description: Database not found
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorResponse'
            example:
              error: Database not found

database_export:
  parameters:
    - name: id
      in: path
      required: true
      description: Database instance ID
      schema:
        type: integer
  get:
    operationId: exportEntity
    summary: Export Entity
    description: |
      Serializes a PCD entity from this database into its portable JSON
      representation. The portable format strips database IDs and timestamps,
      producing a self-contained snapshot suitable for clipboard copy, file
      export, or cross-database import.
    tags:
      - Databases
    parameters:
      - name: entityType
        in: query
        required: true
        description: The entity type to export
        schema:
          $ref: '../schemas/pcd.yaml#/EntityType'
      - name: name
        in: query
        required: true
        description: The entity name to export
        schema:
          type: string
    responses:
      '200':
        description: Portable entity JSON
        content:
          application/json:
            schema:
              $ref: '../schemas/pcd.yaml#/ExportResponse'
      '400':
        description: Missing or invalid query parameters
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorResponse'
            example:
              error: 'Missing required parameters: entityType, name'
      '401':
        description: Not authenticated
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorResponse'
            example:
              error: Unauthorized
      '404':
        description: Database or entity not found
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorResponse'
            example:
              error: Entity not found

database_import:
  parameters:
    - name: id
      in: path
      required: true
      description: Database instance ID
      schema:
        type: integer
  post:
    operationId: importEntity
    summary: Import Entity
    description: |
      Deserializes a portable entity into PCD operations, creating it in this
      database at the specified layer.

      The request body matches the export response format (`entityType` + `data`),
      plus `layer` to specify the target layer (`user` or `base`).

      The `data` shape is validated against `entityType`: required fields and
      their types are checked for the matching portable schema, so mismatches
      (e.g. sending a `quality_profile` body with `entityType: delay_profile`)
      return 400. Validation is top-level only. Extra fields are ignored and
      nested array contents are not deep-checked.
    tags:
      - Databases
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/pcd.yaml#/ImportRequest'
    responses:
      '200':
        description: Entity created successfully
        content:
          application/json:
            schema:
              $ref: '../schemas/pcd.yaml#/ImportResponse'
      '400':
        description: Validation error (missing fields, invalid layer, invalid data)
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorResponse'
            example:
              error: 'Missing required fields: layer, entityType, data'
      '401':
        description: Not authenticated
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorResponse'
            example:
              error: Unauthorized
      '403':
        description: Cannot write to base layer
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorResponse'
            example:
              error: Cannot write to base layer
      '404':
        description: Database not found
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorResponse'
            example:
              error: Database not found
      '409':
        description: An entity with this name already exists
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorResponse'
            example:
              error: A custom format with name "Foo" already exists

database_sync:
  parameters:
    - name: id
      in: path
      required: true
      description: Database instance ID
      schema:
        type: integer
  post:
    operationId: syncDatabase
    summary: Trigger Sync
    description: |
      Async. Enqueues a `pcd.sync` job and returns 202 with the job ID.
      Poll `GET /api/v1/jobs/{jobId}` for completion.
    tags:
      - Databases
    responses:
      '202':
        description: Sync job enqueued
        content:
          application/json:
            schema:
              $ref: '../schemas/databases.yaml#/SyncTriggerResponse'
            example:
              jobId: 42
      '400':
        description: Database is disabled
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorResponse'
            example:
              error: Database is disabled
      '401':
        description: Not authenticated
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorResponse'
            example:
              error: Unauthorized
      '404':
        description: Database not found
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorResponse'
            example:
              error: Database not found
