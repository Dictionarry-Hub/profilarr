instances:
  get:
    operationId: listArrInstances
    summary: List Arr Instances
    description: |
      Returns all Arr instances (Radarr/Sonarr) with secrets stripped.

      **Use cases:**
      - Dashboard widgets showing connected instances
      - Automation scripts checking instance state
      - Prerequisite checks (e.g. onboarding)

      **Behavior:**
      - Returns an empty array if no instances are connected
      - The `api_key` field is never included
    tags:
      - Arr
    responses:
      '200':
        description: List of Arr instances
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../schemas/arr.yaml#/ArrInstance'
      '401':
        description: Not authenticated

sync-entity:
  post:
    operationId: syncEntity
    summary: Sync a single entity to an Arr instance
    description: |
      Pushes a single entity to an Arr instance. Runs inline and returns when complete.

      Entity types are grouped into sync sections that share cooldown and status tracking:
        - **qualityProfiles**: qualityProfile, customFormat, regularExpression
        - **delayProfiles**: delayProfile
        - **mediaManagement**: naming, qualityDefinitions, mediaSettings

      The section is derived automatically from the entity type. A 5-second cooldown
      is enforced per section per instance — entity types within the same section share
      the cooldown. Returns 409 if a sync is already in progress or the cooldown is active.
    tags:
      - Arr
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/arr.yaml#/SyncEntityRequest'
    responses:
      '200':
        description: Entity synced successfully
        content:
          application/json:
            schema:
              $ref: '../schemas/arr.yaml#/SyncEntitySuccessResponse'
      '400':
        description: Invalid request parameters
        content:
          application/json:
            schema:
              $ref: '../schemas/arr.yaml#/ErrorResponse'
      '404':
        description: Instance not found
        content:
          application/json:
            schema:
              $ref: '../schemas/arr.yaml#/ErrorResponse'
      '409':
        description: Cooldown active or sync in progress
        content:
          application/json:
            schema:
              $ref: '../schemas/arr.yaml#/SyncEntityCooldownResponse'
      '500':
        description: Sync failed
        content:
          application/json:
            schema:
              $ref: '../schemas/arr.yaml#/ErrorResponse'
