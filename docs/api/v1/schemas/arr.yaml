ArrInstance:
  type: object
  required:
    - id
    - name
    - type
    - url
    - enabled
    - library_refresh_interval
    - created_at
    - updated_at
  properties:
    id:
      type: integer
      description: Instance ID
    name:
      type: string
      description: Display name
    type:
      $ref: '#/ArrType'
    url:
      type: string
      description: Instance URL used by Profilarr's backend for API calls
    external_url:
      type: string
      nullable: true
      description: |
        Optional external/browser-facing URL. When set, the UI uses this for
        "Open in Radarr/Sonarr" browser links while Profilarr's backend continues
        to call the instance using `url`. Useful for reverse-proxied deployments
        where the internal and external hostnames differ.
      example: https://radarr.example.com
    tags:
      type: string
      nullable: true
      description: JSON array of tags
    enabled:
      type: integer
      description: Whether the instance is active (0 or 1)
    library_refresh_interval:
      type: integer
      description: Library cache refresh interval in minutes (0 = manual)
    library_last_refreshed_at:
      type: string
      nullable: true
      description: Last library refresh timestamp
    created_at:
      type: string
      description: Creation timestamp
    updated_at:
      type: string
      description: Last update timestamp

ArrType:
  type: string
  enum:
    - radarr
    - sonarr
  description: Type of Arr instance

# Shared types
CustomFormatRef:
  type: object
  required:
    - id
    - name
  properties:
    id:
      type: integer
      description: Custom format ID
    name:
      type: string
      description: Custom format name

ScoreBreakdownItem:
  type: object
  required:
    - name
    - score
  properties:
    name:
      type: string
      description: Custom format name
    score:
      type: integer
      description: Score assigned by the quality profile

ErrorResponse:
  type: object
  required:
    - error
  properties:
    error:
      type: string
      description: Error message
