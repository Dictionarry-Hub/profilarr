ArrInstance:
  type: object
  required:
    - id
    - name
    - type
    - url
    - enabled
    - library_refresh_interval
    - created_at
    - updated_at
  properties:
    id:
      type: integer
      description: Instance ID
    name:
      type: string
      description: Display name
    type:
      $ref: '#/ArrType'
    url:
      type: string
      description: Instance URL used by Profilarr's backend for API calls
    external_url:
      type: string
      nullable: true
      description: |
        Optional external/browser-facing URL. When set, the UI uses this for
        "Open in Radarr/Sonarr" browser links while Profilarr's backend continues
        to call the instance using `url`. Useful for reverse-proxied deployments
        where the internal and external hostnames differ.
      example: https://radarr.example.com
    tags:
      type: string
      nullable: true
      description: JSON array of tags
    enabled:
      type: integer
      description: Whether the instance is active (0 or 1)
    library_refresh_interval:
      type: integer
      description: Library cache refresh interval in minutes (0 = manual)
    library_last_refreshed_at:
      type: string
      nullable: true
      description: Last library refresh timestamp
    created_at:
      type: string
      description: Creation timestamp
    updated_at:
      type: string
      description: Last update timestamp

ArrType:
  type: string
  enum:
    - radarr
    - sonarr
  description: Type of Arr instance

# Shared types
CustomFormatRef:
  type: object
  required:
    - id
    - name
  properties:
    id:
      type: integer
      description: Custom format ID
    name:
      type: string
      description: Custom format name

ScoreBreakdownItem:
  type: object
  required:
    - name
    - score
  properties:
    name:
      type: string
      description: Custom format name
    score:
      type: integer
      description: Score assigned by the quality profile

# Releases endpoint types
GroupedRelease:
  type: object
  required:
    - title
    - size
    - languages
    - indexers
    - flags
  properties:
    title:
      type: string
      description: Release title
    size:
      type: integer
      description: Release size in bytes
    languages:
      type: array
      items:
        type: string
      description: Languages detected in the release
    indexers:
      type: array
      items:
        type: string
      description: Indexers where this release was found
    flags:
      type: array
      items:
        type: string
      description: Release flags (e.g., freeleech, internal)

ReleasesResponse:
  type: object
  required:
    - type
    - rawCount
    - releases
  properties:
    type:
      $ref: '#/ArrType'
    rawCount:
      type: integer
      description: Total number of raw releases before grouping
    releases:
      type: array
      items:
        $ref: '#/GroupedRelease'
      description: Grouped and deduplicated releases

ErrorResponse:
  type: object
  required:
    - error
  properties:
    error:
      type: string
      description: Error message

# Sync entity endpoint types
SyncEntityRequest:
  type: object
  required:
    - instanceId
    - databaseId
    - entityName
    - entityType
  properties:
    instanceId:
      type: integer
      description: Arr instance ID
    databaseId:
      type: integer
      description: PCD database ID
    entityName:
      type: string
      description: Name of the entity to sync
    entityType:
      type: string
      enum:
        - qualityProfile
        - customFormat
        - regularExpression
        - delayProfile
        - naming
        - qualityDefinitions
        - mediaSettings
      description: >
        Type of entity being synced. Determines which sync function runs and which
        cooldown group applies (qualityProfiles, delayProfiles, or mediaManagement).

SyncEntitySuccessResponse:
  type: object
  required:
    - success
  properties:
    success:
      type: boolean
      enum:
        - true

SyncEntityCooldownResponse:
  type: object
  required:
    - error
  properties:
    error:
      type: string
      description: Cooldown or in-progress message
    retryAfter:
      type: integer
      description: Seconds until cooldown expires
